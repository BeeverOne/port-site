---
# Build the site and run the unit tests and the end-to-end suite in Chromium, WebKit and Firefox
# (ADR-0011, QS-05, NFR-06). Firefox runs only here: on the owner's Mac (macOS 27) Firefox cannot be
# started from the command line, so the local suite covers Chrome and WebKit.
# npm run verify is not part of CI: it compares against the prototype in docs/, which is not in the
# repository; run it locally.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Google Chrome is preinstalled on the runner (the chromium project uses it); WebKit and
      # Firefox come from Playwright, with their system libraries.
      - run: npx playwright install --with-deps webkit firefox
      # Cloudflare's public test site key (always passes, safe to publish): without a key the contact
      # form never loads the widget, and the suite stubs Turnstile anyway. No secret is needed to build.
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm test
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 14
