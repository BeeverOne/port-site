  - discriminant: heading
    value:
      level: section
      text:
        en: Summary
        de: Fazit
  - discriminant: text
    value:
      en: |-
        The project was delivered in budget and signed off without reservations. It also threw me in at the deep end: networking and hardware integration were both new to me, and most of the hard problems lived in the gap between the two systems rather than inside either one — like the controller that silently ignored every message until I traced the traffic and found it expected a "#" at the end of each one. That lesson stuck: test on the real hardware, early. Working in visual tools taught me a second one — when there is no code to read, the structure of the states and messages is the design, so it has to be clear to the next person who opens it.

        If I extended the system today, I would move the films and the language list into a central content management system, so the museum could update every station from one place.

        Client: Stiftung Fürst-Pückler-Park Bad Muskau · Exhibition design: KOCMOC Exhibitions GmbH · Films: m box bewegtbild GmbH · Supervision at inSynergie: Lisa Rau, Martin Bosshart.

        My part was the software. Hardware installation, on-site network setup and the films were handled by others.
      de: |-
        Das Projekt wurde im Budget geliefert und vorbehaltlos abgenommen. Es hat mich außerdem ins kalte Wasser geworfen: Netzwerktechnik und Hardware-Integration waren beide neu für mich, und die meisten schwierigen Probleme lagen in der Lücke zwischen den beiden Systemen, nicht in einem davon – etwa die Steuerung, die jede Nachricht stillschweigend ignorierte, bis ich den Datenverkehr mitschnitt und feststellte, dass sie am Ende jeder Nachricht ein „#“ erwartete. Diese Lektion ist geblieben: früh auf der echten Hardware testen. Die Arbeit mit visuellen Werkzeugen hat mich eine zweite gelehrt: Wenn es keinen Code zum Lesen gibt, ist die Struktur der Zustände und Nachrichten das Design – also muss sie für die nächste Person, die das Projekt öffnet, klar sein.

        Bei einer Erweiterung würde ich heute die Filme und die Sprachliste in ein zentrales Content-Management-System verlagern, damit das Museum alle Stationen von einer Stelle aus aktualisieren kann.

        Auftraggeber: Stiftung Fürst-Pückler-Park Bad Muskau · Ausstellungsgestaltung: KOCMOC Exhibitions GmbH · Filme: m box bewegtbild GmbH · Betreuung bei inSynergie: Lisa Rau, Martin Bosshart.

        Mein Anteil war die Software. Die Installation der Hardware, die Netzwerkeinrichtung vor Ort und die Filme übernahmen andere.
