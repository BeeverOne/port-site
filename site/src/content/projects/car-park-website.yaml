blocks:
  - discriminant: text
    value:
      en: >-
        A car park website that people, search engines and AI assistants can
        all read and trust, in three languages.
      de: >-
        Eine Parkhaus-Website, die Menschen, Suchmaschinen und
        KI-Assistenten gleichermaßen lesen können und der sie vertrauen - in
        drei Sprachen.
  - discriminant: facts
    value:
      rows:
        - label:
            en: Role
            de: Rolle
          value:
            en: >-
              Sole designer and developer: audit, requirements, design,
